## Seed config shipped with the vendored BepInEx so a fresh deploy has the
## entrypoint this mod is tested with. BepInEx fills every other setting with its
## defaults on first run; only the values below are pre-set.

[Preloader.Entrypoint]

## Hand of Fate 2 is Unity 2017.4. The default Application entrypoint is the one
## verified on this game. The MonoBehaviour entrypoint (needed by the original
## Hand of Fate) intermittently deadlocks HoF2 on its splash screen.
Assembly = UnityEngine.CoreModule.dll
Type = Application
Method = .cctor
